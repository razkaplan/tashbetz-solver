name: Weekly news crossword

# Israeli news feeds are unreachable from the agent sandbox (the egress proxy
# denies them), so the harvest runs here, where the network is open, and
# commits the result. Everything downstream reads the committed snapshot.
#
# It stores only WHICH entities from our own index were mentioned, with our
# own descriptions - never a headline. See scraper/news_israel.py.

on:
  schedule:
    - cron: '0 4 * * 0'   # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest the week's entities
        run: python3 scraper/news_israel.py
      - name: Generate the weekly puzzle and rebuild the pages
        run: |
          python3 app/build_topics.py --generate --topic hadashot
      - name: Gate it
        # The weekly board ships with nobody watching, so it goes through the
        # same eval as everything else and a failure stops the commit. The
        # first live run published four boards with nothing on topic in their
        # long entries precisely because this step did not exist.
        run: |
          python3 evals/topicgen_eval.py --no-matrix
      - name: Commit if anything changed
        run: |
          git config user.name 'news-weekly'
          git config user.email 'noreply@github.com'
          git add solver/lex/topics_news.json docs/nosim
          if git diff --cached --quiet; then
            echo 'no news changes'
          else
            git commit -m "Weekly news crossword: refresh the entity bank and the board"
            git push
          fi
