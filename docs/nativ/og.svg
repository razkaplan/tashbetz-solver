<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="14" fill="#f22b39"/>
  <!-- letter grid, path snakes orthogonally through red cells -->
  <g transform="translate(80,120)">
    <!-- grid frame -->
    <rect x="-14" y="-14" width="428" height="428" fill="none" stroke="#121212" stroke-width="6"/>
    <!-- cells: 4x4, 100px pitch -->
    <!-- path cells (orthogonal snake: נ-ת-י-ב) -->
    <rect x="300" y="0" width="90" height="90" fill="#f22b39" rx="6"/>
    <rect x="300" y="100" width="90" height="90" fill="#f22b39" rx="6"/>
    <rect x="200" y="100" width="90" height="90" fill="#f22b39" rx="6"/>
    <rect x="200" y="200" width="90" height="90" fill="#f22b39" rx="6"/>
    <!-- neutral cells -->
    <rect x="0" y="0" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="100" y="0" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="200" y="0" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="0" y="100" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="100" y="100" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="0" y="200" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="100" y="200" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="300" y="200" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="0" y="300" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="100" y="300" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="200" y="300" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <rect x="300" y="300" width="90" height="90" fill="#f5f4f2" rx="6"/>
    <!-- path line connecting centers (orthogonal) -->
    <polyline points="345,45 345,145 245,145 245,245" fill="none" stroke="#b3121f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="345" cy="45" r="14" fill="#b3121f"/>
    <!-- letters on path: נ ת י ב -->
    <g font-family="'Frank Ruhl Libre','Arial Hebrew','Noto Sans Hebrew',serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle">
      <text x="345" y="63">נ</text>
      <text x="345" y="163">ת</text>
      <text x="245" y="163">י</text>
      <text x="245" y="263">ב</text>
    </g>
    <!-- filler letters -->
    <g font-family="'Frank Ruhl Libre','Arial Hebrew','Noto Sans Hebrew',serif" font-weight="700" font-size="46" fill="#8a877f" text-anchor="middle">
      <text x="45" y="61">ש</text><text x="145" y="61">ר</text><text x="245" y="61">ק</text>
      <text x="45" y="161">ד</text><text x="145" y="161">ל</text>
      <text x="45" y="261">ם</text><text x="145" y="261">ג</text><text x="345" y="261">ה</text>
      <text x="45" y="361">ו</text><text x="145" y="361">א</text><text x="245" y="361">ח</text><text x="345" y="361">ע</text>
    </g>
  </g>
  <!-- text block (right side, RTL) -->
  <g text-anchor="end">
    <text x="1120" y="215" font-family="'Frank Ruhl Libre','Arial Hebrew','Noto Sans Hebrew',serif" font-weight="900" font-size="150" fill="#121212">נתיב</text>
    <text x="1120" y="300" font-family="'Frank Ruhl Libre','Arial Hebrew','Noto Sans Hebrew',serif" font-weight="700" font-size="52" fill="#f22b39">משחק מילים יומי בעברית</text>
    <text x="1120" y="372" font-family="'Frank Ruhl Libre','Arial Hebrew','Noto Sans Hebrew',serif" font-size="30" fill="#6b6862">מסלול אחד, כל האותיות, נושא חדש כל יום</text>
    <text x="1120" y="510" font-family="'Frank Ruhl Libre','Arial Hebrew','Noto Sans Hebrew',serif" font-weight="700" font-size="34" fill="#121212">tashbetz.gtmascode.dev/nativ</text>
  </g>
  <rect x="0" y="616" width="1200" height="14" fill="#121212"/>
</svg>
